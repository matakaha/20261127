name: Tests

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install coverage==7.17.5
      - run: coverage run --branch --source=division -m unittest discover -s tests -v
      - run: coverage report --fail-under=100
